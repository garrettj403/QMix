# Virtual environment for QMix
# see: https://docs.conda.io/projects/conda/en/latest/user-guide/tasks/manage-environments.html
#
# Create new environment using:
#     conda env create -f environment.yml
#
# Remove using:
#     conda remove --name qmix --all
#

name: qmix
channels:
  - defaults
  - conda-forge
dependencies:
  - python>=3.10
  - pip
  # QMix dependencies (same as requirements.txt)
  - matplotlib
  - numba
  - numpy
  - scipy
  # for running the notebooks and generating documentation
  - ipython
  - ipykernel
  - jupyter
  - nbconvert
  - pandoc
  - sphinx
  - sphinx_rtd_theme
  # for testing
  - pytest
  - pytest-cov
  - pip:
    # plot styles used by the notebooks
    - scienceplots
    # for generating documentation
    - nbsphinx
    # for profiling
    - snakeviz
    - memory_profiler
    - line_profiler
